name: ETH Gem Radar Scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt

      - name: Taramayi calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          MIN_MARKET_CAP_USD: "10000"
          MAX_MARKET_CAP_USD: "500000"
          MIN_LIQUIDITY_USD: "5000"
          MAX_POOL_AGE_HOURS: "24"
          MIN_SCORE_TO_ALERT: "70"
        run: python gem_scanner.py

      - name: Gonderilen token listesini kaydet (state)
        run: |
          git config user.name "gem-radar-bot"
          git config user.email "actions@github.com"
          git add sent_tokens.json || true
          git diff --quiet --cached || git commit -m "state guncelle [skip ci]"
          git push || true
